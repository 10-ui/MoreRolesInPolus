name: Major Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    # PRがマージされた場合のみ実行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Extract Version from PR Title
      id: version
      shell: bash
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        echo "PR Title: $PR_TITLE"
        
        # PRタイトルから v1.0.0 のようなバージョンを抽出
        if [[ $PR_TITLE =~ (v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
          VERSION="${BASH_REMATCH[1]}"
          echo "found=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=MoreRolesInPolus-$VERSION.zip" >> $GITHUB_OUTPUT
          echo "release_name=Release $VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"
        else
          echo "found=false" >> $GITHUB_OUTPUT
          echo "No version found in PR title"
        fi
    
    - name: Create Tag
      if: steps.version.outputs.found == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag ${{ steps.version.outputs.version }}
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} ${{ steps.version.outputs.version }}
    
    - name: Create ZIP from source
      if: steps.version.outputs.found == 'true'
      run: |
        cd MoreRolesInPolus
        zip -r ../${{ steps.version.outputs.filename }} .
    
    - name: Get PR body
      if: steps.version.outputs.found == 'true'
      id: pr_body
      run: |
        BODY="${{ github.event.pull_request.body }}"
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Release
      if: steps.version.outputs.found == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.version.outputs.filename }}
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.release_name }}
        body: ${{ steps.pr_body.outputs.body }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
